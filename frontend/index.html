<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Handwriting Detection</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="header">
  <h1>Handwriting Detection System</h1>
  <p>Upload a handwriting sample to identify the writer</p>
</header>

<main class="container">

  <!-- Input Panel -->
  <section class="panel input-panel">
    <h2>Input</h2>

    <label class="upload-area">
      <span id="uploadText">Click to upload handwriting image</span>
      <input type="file" id="imageInput" accept="image/*" hidden />
    </label>

    <img id="preview" alt="Preview Image" />

    <button id="analyzeBtn" disabled onclick="analyze()">
      Analyze Handwriting
    </button>
  </section>

  <!-- Output Panel -->
  <section class="panel output-panel">
    <h2>Result</h2>

    <div class="status" id="status">
      Waiting for input…
    </div>

    <div class="result hidden" id="resultBox">
      <p><strong>Name:</strong> <span id="name">—</span></p>

      <div class="accuracy">
        <div class="accuracy-bar">
          <div id="accuracyFill"></div>
        </div>
        <span id="accuracy">0%</span>
      </div>
    </div>
  </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
